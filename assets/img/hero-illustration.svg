<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="heroIllTitle heroIllDesc">
  <title id="heroIllTitle">Illustratie van begeleiding en verbinding</title>
  <desc id="heroIllDesc">Twee figuren die samen een pad volgen, als symbool voor persoonlijke begeleiding en groei.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3f38"/>
      <stop offset="100%" stop-color="#2c6358"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a7a6c"/>
      <stop offset="100%" stop-color="#2c6358"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234f46"/>
      <stop offset="100%" stop-color="#1b3f38"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#skyGrad)"/>

  <!-- zachte lichtcirkel -->
  <circle cx="590" cy="230" r="190" fill="#cf8b52" opacity="0.16"/>
  <circle cx="590" cy="230" r="120" fill="#f6e9dc" opacity="0.14"/>

  <!-- verre glooiing -->
  <path d="M0 560 C 140 500, 300 620, 460 560 C 600 510, 700 590, 800 540 L800 1000 L0 1000 Z" fill="url(#hillGrad2)" opacity="0.55"/>

  <!-- middelste glooiing -->
  <path d="M0 660 C 160 600, 320 700, 480 650 C 620 610, 700 680, 800 640 L800 1000 L0 1000 Z" fill="url(#hillGrad1)"/>

  <!-- pad -->
  <path d="M120 1000 C 220 840, 260 760, 360 690 C 440 630, 470 560, 470 470" fill="none" stroke="#f6e9dc" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.75"/>

  <!-- kleine bladmotieven (groei) -->
  <g opacity="0.9">
    <path d="M600 760 c 20 -30 55 -30 70 -5 c -25 15 -50 15 -70 5 Z" fill="#a5602f" opacity="0.5"/>
    <path d="M650 800 c 25 -22 58 -14 68 10 c -28 10 -52 3 -68 -10 Z" fill="#cf8b52" opacity="0.5"/>
    <path d="M150 500 c 18 -26 48 -24 60 -2 c -22 14 -44 12 -60 2 Z" fill="#f6e9dc" opacity="0.35"/>
  </g>

  <!-- voorste heuvel -->
  <path d="M0 800 C 180 730, 340 820, 520 770 C 640 735, 720 790, 800 760 L800 1000 L0 1000 Z" fill="#14302a"/>

  <!-- twee figuren: begeleider en cliënt, samen op pad -->
  <g transform="translate(330,560)">
    <!-- figuur 1 (begeleider, iets groter) -->
    <g transform="translate(0,0)">
      <ellipse cx="34" cy="240" rx="30" ry="8" fill="#0f241f" opacity="0.35"/>
      <path d="M34 90 C10 90 4 120 8 150 L14 235 L26 235 L30 165 L34 235 L34 235 L38 165 L42 235 L54 235 L60 150 C64 120 58 90 34 90 Z" fill="#f6e9dc"/>
      <circle cx="34" cy="66" r="26" fill="#f6e9dc"/>
      <path d="M10 95 C 4 70 14 44 34 44 C 54 44 64 70 58 95 C 50 78 18 78 10 95 Z" fill="#cf8b52"/>
    </g>
    <!-- figuur 2 (cliënt, iets kleiner, ernaast) -->
    <g transform="translate(66,26)">
      <ellipse cx="26" cy="200" rx="24" ry="7" fill="#0f241f" opacity="0.35"/>
      <path d="M26 70 C6 70 2 96 6 120 L10 196 L20 196 L24 138 L26 196 L26 196 L30 138 L34 196 L44 196 L48 120 C52 96 46 70 26 70 Z" fill="#f2f6f4"/>
      <circle cx="26" cy="50" r="21" fill="#f2f6f4"/>
      <path d="M8 54 C 4 34 12 15 26 15 C 40 15 48 34 44 54 C 38 40 14 40 8 54 Z" fill="#3a7a6c"/>
    </g>
    <!-- verbindende lijn (samenwerken) -->
    <path d="M60 120 C 74 108 78 108 90 118" stroke="#f6e9dc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- kleine sterretjes / lichtpuntjes -->
  <g fill="#f6e9dc" opacity="0.55">
    <circle cx="120" cy="140" r="3"/>
    <circle cx="220" cy="90" r="2.4"/>
    <circle cx="700" cy="120" r="2.6"/>
    <circle cx="90" cy="260" r="2"/>
  </g>
</svg>
